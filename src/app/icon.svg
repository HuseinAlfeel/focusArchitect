<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Tab-Fassung von public/logoFocus.svg: gleiches Motiv (offener Orbit um
       einen ruhenden Kern), aber ohne Schatten, Glow, zweiten Ring und
       Animation - bei 16 Pixel Kantenlaenge ueberlebt davon nichts. Kachel
       und Orbit sind gegenueber der grossen Fassung vertauscht (Farbe
       flaechig, Orbit hell), weil nur eine gefuellte Flaeche in der
       Tableiste ueberhaupt einen erkennbaren Umriss hat. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2a878" />
      <stop offset="1" stop-color="#c47c4a" />
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#card)" />
  <path
    d="M 256 106 A 150 150 0 1 1 106 256"
    fill="none"
    stroke="#fffaf3"
    stroke-width="64"
    stroke-linecap="round"
  />
  <circle cx="256" cy="256" r="46" fill="#fffaf3" />
</svg>
